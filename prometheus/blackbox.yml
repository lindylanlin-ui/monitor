# Blackbox Exporter 模組設定。
# http_2xx: 用來檢查 HTTP/HTTPS 是否成功回應。
# tcp_connect: 只檢查 TCP 三向交握能不能成功建立。
# icmp: 用來檢查裝置是否能被 ping 到。
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []
      method: GET
  # 公開入口專用健康檢查：不跟隨轉址，並容許常見的 3xx。
  # 目前 target 是 /healthz，正常結果應為 200；容許 3xx 可避免日後保留舊路徑時
  # 因登入或尾端斜線轉址產生不必要的 probe failure。
  http_public_edge:
    prober: http
    timeout: 20s
    http:
      preferred_ip_protocol: ip4
      no_follow_redirects: true
      valid_status_codes: [200, 301, 302, 303, 307, 308]
      method: GET
  # 內部服務專用健康檢查，不經公開網域、Cloudflare 或登入轉址。
  http_internal:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      no_follow_redirects: true
      valid_status_codes: [200]
      method: GET
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
